spring.application.name=frankenstein-monolith
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true


spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Manda o hibernate criar as tabelas ao subir
spring.jpa.hibernate.ddl-auto=create 

# Vai rodar o data.sql depois que as tabelas forem criadas.
spring.jpa.defer-datasource-initialization=true

# Garante que o Spring executará o script também no H2 em memória.
spring.sql.init.mode=always

jwt.secret=frankenstein-super-secret-key-for-hmac-sha-256-token-signing
jwt.expiration=3600000
